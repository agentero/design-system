name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: '🔍 Lint'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: '🟢 Setup Node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: '🔍 Run lint'
        run: pnpm lint
      # Two copies of Radix's layer, focus-scope or focus-guards stack don't see each
      # other: a Select inside a Modal leaves the body locked, or focus escapes the
      # Modal. Bump every @radix-ui package together.
      - name: '🧩 One Radix layer stack'
        run: |
          for pkg in react-dismissable-layer react-focus-scope react-focus-guards; do
            count=$(grep -c "^  '@radix-ui/$pkg@[^(]*':$" pnpm-lock.yaml)
            [ "$count" -eq 1 ] || { echo "pnpm-lock.yaml has $count versions of @radix-ui/$pkg"; exit 1; }
          done

  typecheck:
    name: '💊 Typecheck'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: '🟢 Setup Node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: '💊 Run typecheck'
        run: pnpm tsc

  build:
    name: '🏗️ Build'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: '🟢 Setup Node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: '🏗️ Run library build'
        run: pnpm build

  test:
    name: '🧪 Test'
    # Playwright 1.60 can't install Chromium on ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: '🟢 Setup Node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: '💾 Cache Playwright browsers'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: '🎭 Install Playwright chromium'
        run: pnpm exec playwright install chromium --with-deps
      - name: '🧪 Run tests'
        run: pnpm test

  manifest:
    name: '📋 MCP manifest'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: '🟢 Setup Node'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: '📚 Build Storybook'
        run: pnpm build-storybook
      - name: '📋 Check the MCP manifest'
        run: pnpm check:manifest
