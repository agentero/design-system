name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: '🔍 Lint'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: '🟢 Setup Node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: '🔍 Run lint'
        run: pnpm lint
      # Two copies of Radix's layer stack don't see each other: a Select inside a
      # Modal leaves the body locked. Bump every @radix-ui package together.
      - name: '🧩 One Radix layer stack'
        run: |
          count=$(grep -c "^  '@radix-ui/react-dismissable-layer@[^(]*':$" pnpm-lock.yaml)
          [ "$count" -eq 1 ] || { echo "pnpm-lock.yaml has $count versions of @radix-ui/react-dismissable-layer"; exit 1; }

  typecheck:
    name: '💊 Typecheck'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: '🟢 Setup Node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: '💊 Run typecheck'
        run: pnpm tsc

  build:
    name: '🏗️ Build'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: '🟢 Setup Node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: '🏗️ Run library build'
        run: pnpm build

  test:
    name: '🧪 Test'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: '🟢 Setup Node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: '💾 Cache Playwright browsers'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: '🎭 Install Playwright chromium'
        run: pnpm exec playwright install chromium --with-deps
      - name: '🧪 Run tests'
        run: pnpm test

  manifest:
    name: '📋 MCP manifest'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: '📥 Checkout'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: '📦 Setup pnpm'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: '🟢 Setup Node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: '📦 Install dependencies'
        run: pnpm install --frozen-lockfile
      - name: '📚 Build Storybook'
        run: pnpm build-storybook
      - name: '📋 Check the MCP manifest'
        run: pnpm check:manifest
